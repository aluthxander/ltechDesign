[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ltechdesign"
version = "0.1.0"
description = "Local desktop design application foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==12.3.0",
    "PySide6==6.10.2",
]

[project.gui-scripts]
ltechdesign = "ltechdesign.main:main"

[project.scripts]
ltechdesign-cli = "ltechdesign.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.14.0", "mypy==1.18.2"]
packaging = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
qt_api = "pyside6"
markers = ["core: Domain/schema/geometry and CLI without Qt", "desktop: Qt startup and font smoke only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts/generate_fixtures.py", "scripts/check_file_format.py", "scripts/check_persistence.py", "scripts/persistence_worker.py", "scripts/recovery_worker.py", "scripts/demo_projects.py", "scripts/demo_export.py", "scripts/demo_renderer.py", "scripts/demo_layout.py", "scripts/check_render_conformance.py", "scripts/check_canvas_aids.py", "scripts/check_text_conformance.py", "scripts/check_image_conformance.py", "scripts/benchmark_editor.py", "scripts/baseline.py", "scripts/freeze_desktop.py", "tests"]

[tool.uv]
required-version = "==0.12.1"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/.github", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore"]

